name: slitting-planner

services:
  api:
    build: ./api
    image: slitting-planner-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    image: slitting-planner-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收服务：执行完即退出。若纳入默认启动，docker compose up --wait
  # 会因其退出而误报整套服务启动失败，故用 profile 隔离，按需显式启动。
  verify:
    profiles: ["verify"]
    build: ./verify
    image: slitting-planner-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web
    restart: "no"
