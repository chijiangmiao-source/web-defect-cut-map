name: slitting-planner

services:
  api:
    build: ./api
    image: slitting-planner-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./web
    image: slitting-planner-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收服务：对真实 API 与前端代理执行断言后退出
  verify:
    build: ./verify
    image: slitting-planner-verify
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      WEB_BASE_URL: http://web
    restart: "no"
